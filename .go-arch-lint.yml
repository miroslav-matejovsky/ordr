version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: true

exclude:
  - "examples"
  - "test"
  - "vendor"
  - ".tmp"

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*\/test\/.*$"

vendors:
  cue: { in: "cuelang.org/go/**" }
  yaml: { in: "go.yaml.in/yaml/**" }

# One component per bounded context. Dependencies point toward the domain:
# main -> cli -> workspace, projections -> graph -> knowledge.
components:
  main: { in: . }
  cli: { in: cli }
  workspace: { in: workspace }
  projections: { in: projections }
  graph: { in: graph }
  cuegraph: { in: graph/cuegraph }
  knowledge: { in: knowledge }

deps:
  main:
    mayDependOn: [cli]
  cli:
    mayDependOn: [workspace, projections]
  workspace:
    mayDependOn: [knowledge, graph, cuegraph]
    canUse: [yaml]
  projections:
    mayDependOn: [knowledge, graph]
  cuegraph:
    mayDependOn: [knowledge, graph]
    canUse: [cue]
  graph:
    mayDependOn: [knowledge]
